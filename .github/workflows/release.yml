name: Release

# Push a tag like v0.4.0 (matching __version__ in firefly/firefly/__init__.py) to
# zip the firefly/ folder as firefly_v0.4.0.zip and publish it as a GitHub Release,
# with that version's CHANGELOG.md section as the release notes.
# "Run workflow" by hand builds the same zip as a downloadable artifact, no release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: v
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' firefly/firefly/__init__.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ $VERSION in firefly/firefly/__init__.py"
            exit 1
          fi

      - name: Build firefly_v${{ steps.v.outputs.version }}.zip
        run: |
          OUT="firefly_v${{ steps.v.outputs.version }}.zip"
          find firefly -name __pycache__ -prune -exec rm -rf {} +
          zip -qr -X "$OUT" firefly
          unzip -l "$OUT" | tail -n 1

      - name: Release notes from CHANGELOG.md
        run: |
          V="${{ steps.v.outputs.version }}"
          awk -v v="## $V" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          printf '\n**Install:** download `firefly_v%s.zip` below and follow [INSTALL.md](%s/%s/blob/main/INSTALL.md).\n' \
            "$V" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> notes.md
          cat notes.md

      - name: Keep the zip as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefly_v${{ steps.v.outputs.version }}.zip
          path: firefly_v${{ steps.v.outputs.version }}.zip

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: FireFly for RK3326 ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: firefly_v${{ steps.v.outputs.version }}.zip
