name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04   # ubuntu-latest (26.04) has no Python 3.9, the oldest install.sh accepts
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest Python install.sh accepts; 3.11 matches current Debian-based dArkOS images.
        python: ["3.9", "3.11"]
    defaults:
      run:
        working-directory: firefly
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Same packages install.sh puts on the handheld: the voice-note decoders from apt,
      # and exactly the rns/lxmf versions it pins.
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq opus-tools codec2
          pip install "rns==1.6.1" "lxmf==1.3.1" "pygame>=2" pyserial cryptography

      - name: UI smoke test (6000 random button presses)
        run: python tests/ui_smoke.py

      - name: Layout at every supported screen geometry
        run: python tests/devices.py "$RUNNER_TEMP/devshots"

      - name: Chat selector (voice notes, details, new arrivals)
        timeout-minutes: 2
        run: python tests/run_chat_selector.py

      - name: A Stump's rooms one at a time, and the STUMPS tab
        timeout-minutes: 2
        run: python tests/run_rooms.py

      - name: Radio manager against simulated RNodes
        timeout-minutes: 3
        run: python tests/run_radio.py

      - name: Other LXMF apps (address codes, commands, formatting)
        timeout-minutes: 2
        run: python tests/run_interop.py

      - name: Chat with a Stump over Wi-Fi (fake web API)
        timeout-minutes: 3
        run: python tests/run_stumpweb.py

      - name: The local network, followed live
        timeout-minutes: 3
        run: python tests/run_lan.py

      - name: QR codes for addresses
        timeout-minutes: 2
        run: python tests/run_qr.py

      - name: Stump 1.0.0-beta.34 line protocol
        timeout-minutes: 2
        run: python tests/run_stump_protocol.py

      - name: Packed text (Stump 1.0.0-beta.82)
        timeout-minutes: 2
        run: python tests/run_packed_text.py

      - name: Reticulum 1.6.1 announce stamps (FireFly's own, and other nodes')
        timeout-minutes: 4
        run: python tests/run_announce_stamps.py

      - name: radio.json from the Stump provisioner, and the network passphrase
        timeout-minutes: 3
        run: python tests/run_radiojson.py

      - name: LXMF end-to-end with a peer and a fake Stump
        timeout-minutes: 3
        run: python tests/run_integration.py

      - name: Delete and block, across a restart
        timeout-minutes: 3
        run: python tests/run_block.py

      - name: Voice notes (Codec 2 spec test vector, Opus, SD copy)
        timeout-minutes: 3
        run: python tests/run_voice.py

      - name: Offline delivery through a propagation node
        timeout-minutes: 8
        run: python tests/run_propagation.py

      - name: Upload device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devshots-py${{ matrix.python }}
          path: ${{ runner.temp }}/devshots
          if-no-files-found: ignore
